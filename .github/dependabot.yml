version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # odd-numbered Node releases never become long-term support
      - dependency-name: node
        versions: ["25.x", "27.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
