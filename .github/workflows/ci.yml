name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # only what ships to users; the one known dev-only advisory has no fix yet
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm secrets

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: news-aggregator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image and check it answers
        run: |
          docker run -d --name app -p 8080:8080 news-aggregator:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/api/news/sources | grep '"demo":true'
          curl -fs localhost:8080/ | grep -i '<title>Newsroom</title>'
          docker rm -f app

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # builds the app and starts it with no API keys, so the tests use the sample articles
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

